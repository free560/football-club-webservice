<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Joueurs</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-blue-900 text-white shadow-lg">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">

            <h1 class="text-2xl font-bold">
                Football Club Management
            </h1>

            <a href="dashboard.html"
                class="bg-white text-blue-900 px-4 py-2 rounded-lg font-medium hover:bg-gray-200">
                Dashboard
            </a>

        </div>
        <button id="logoutButton" type="button" class="bg-red-600 text-white px-4 py-2 rounded-lg"> 🚪 Déconnexion</button>
    </header>

    <!-- Main Content -->
    <div class="container mx-auto p-6">

        <!-- Page Title -->
        <div class="mb-6">
            <h2 class="text-3xl font-bold text-gray-800">
                Gestion des Joueurs
            </h2>

            <p class="text-gray-500">
                Ajouter, afficher et supprimer les joueurs de votre club.
            </p>
        </div>

        <!-- Formulaire -->
        <div class="bg-white rounded-2xl shadow-lg p-6">

            <h3 class="text-xl font-semibold mb-4">
                Ajouter un joueur
            </h3>

            <form id="joueurForm">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <div>
                        <label class="block mb-2 font-medium">
                            Nom
                        </label>

                        <input id="nom"
                            type="text"
                            placeholder="Nom du joueur"
                            required
                            class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block mb-2 font-medium">
                            Prénom
                        </label>

                        <input id="prenom"
                            type="text"
                            placeholder="Prénom du joueur"
                            required
                            class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block mb-2 font-medium">
                            Poste
                        </label>

                        <select id="poste"
                            class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

                            <option value="">Choisir un poste</option>
                            <option>Gardien</option>
                            <option>Défenseur</option>
                            <option>Milieu</option>
                            <option>Attaquant</option>

                        </select>
                    </div>

                    <div>
                        <label class="block mb-2 font-medium">
                            Numéro
                        </label>

                        <input id="numero"
                            type="number"
                            min="1"
                            max="99"
                            placeholder="Numéro"
                            required
                            class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                </div>

                <button
                    type="submit"
                    class="mt-6 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium">

                    Ajouter Joueur

                </button>

            </form>

        </div>

        <!-- Tableau -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mt-8">

            <div class="flex justify-between items-center mb-4">

                <h3 class="text-xl font-semibold">
                    Liste des Joueurs
                </h3>

                <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm">
                    Firebase Firestore
                </span>

            </div>

            <div class="overflow-x-auto">

                <table class="min-w-full border border-gray-300">

                    <thead class="bg-blue-900 text-white">

                        <tr>
                            <th class="p-3 border">Nom</th>
                            <th class="p-3 border">Prénom</th>
                            <th class="p-3 border">Poste</th>
                            <th class="p-3 border">Numéro</th>
                            <th class="p-3 border">Actions</th>
                        </tr>

                    </thead>

                    <tbody id="joueursTable">

                        <!-- Données chargées depuis Firebase -->

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script type="module" src="assets/js/joueurs.js"></script>
    <script type="module" src="assets/js/auth-guard.js"></script>
    <script type="module" src="assets/js/logout.js"></script>
</body>
