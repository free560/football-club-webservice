<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Stades</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100">

    <header class="bg-blue-900 text-white shadow-lg">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">

            <h1 class="text-2xl font-bold">
                🏟️ Gestion des Stades
            </h1>

            <a href="dashboard.html"
                class="bg-white text-blue-900 px-4 py-2 rounded-lg">
                Dashboard
            </a>

        </div>
    </header>

    <div class="container mx-auto p-6">

        <div class="mb-6">
            <h2 class="text-3xl font-bold">
                Gestion des Stades
            </h2>

            <p class="text-gray-500">
                Ajouter et gérer les stades du club.
            </p>
        </div>

        <!-- Formulaire -->

        <div class="bg-white p-6 rounded-2xl shadow-lg">

            <h3 class="text-xl font-semibold mb-4">
                Ajouter un Stade
            </h3>

            <form id="stadeForm">

                <div class="grid md:grid-cols-2 gap-4">

                    <input
                        id="nom"
                        type="text"
                        placeholder="Nom du stade"
                        required
                        class="border rounded-lg p-3">

                    <input
                        id="ville"
                        type="text"
                        placeholder="Ville"
                        required
                        class="border rounded-lg p-3">

                    <input
                        id="capacite"
                        type="number"
                        placeholder="Capacité"
                        required
                        class="border rounded-lg p-3">

                    <input
                        id="adresse"
                        type="text"
                        placeholder="Adresse"
                        class="border rounded-lg p-3">

                </div>

                <button
                    type="submit"
                    class="mt-5 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">

                    Ajouter Stade

                </button>

            </form>

        </div>

        <!-- Tableau -->

        <div class="bg-white p-6 rounded-2xl shadow-lg mt-8">

            <h3 class="text-xl font-semibold mb-4">
                Liste des Stades
            </h3>

            <div class="overflow-x-auto">

                <table class="min-w-full border">

                    <thead class="bg-blue-900 text-white">

                        <tr>
                            <th class="border p-3">Nom</th>
                            <th class="border p-3">Ville</th>
                            <th class="border p-3">Capacité</th>
                            <th class="border p-3">Adresse</th>
                            <th class="border p-3">Actions</th>
                        </tr>

                    </thead>

                    <tbody id="stadesTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script
        type="module"
        src="assets/js/auth-guard.js">
    </script>
    
    <script
        type="module"
        src="assets/js/stades.js">
    </script>
    
    <script
        type="module"
        src="assets/js/logout.js">
    </script>    

</body>

</html>
